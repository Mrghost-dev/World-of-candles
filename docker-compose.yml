services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ravin_trading}
      POSTGRES_USER: ${POSTGRES_USER:-ravin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-ravin} -d ${POSTGRES_DB:-ravin_trading}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  postgres_data:

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:12.1.1
    depends_on: [prometheus]
    ports: ['3001:3000']
